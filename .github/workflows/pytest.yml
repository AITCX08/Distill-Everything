name: pytest

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff（Python 3.11）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests main.py scripts

  python-linux:
    name: Python（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify import order
        run: |
          python -c "import src.outputs; import src.platforms; import src.distillation"
          python -c "import src.outputs.base"
      - name: Run test suite
        run: python -m pytest --timeout=180

  python-windows:
    name: Python（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify import order
        run: |
          python -c "import src.outputs; import src.platforms; import src.distillation"
          python -c "import src.outputs.base"
      - name: Run backend suite
        run: >-
          python -m pytest
          tests/application
          tests/distillation
          tests/outputs
          tests/platforms
          tests/test_import_order.py
          --timeout=180
          -p no:cacheprovider
      - name: Run orchestration, dashboard and document suite
        run: >-
          python -m pytest
          tests/orchestration
          tests/series
          tests/dashboard
          tests/test_meeting_renderer.py
          tests/test_text_processor.py
          tests/test_knowledge_extractor.py
          --timeout=180
          -p no:cacheprovider

  python-macos:
    name: Python（macOS 基础）
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run offline macOS smoke tests
        run: >-
          python -m pytest
          tests/test_import_order.py
          tests/dashboard/test_series_control.py
          tests/dashboard/test_artifact_api.py
          tests/outputs/test_episodes.py
          --timeout=180
