# 仅用于开发工具配置（pytest / ruff / coverage）。
# 本项目以源码方式运行（`python main.py ...`），不通过 pip 分发；
# 运行期依赖见 requirements.txt，开发期依赖见 requirements-dev.txt。
# 版本号的单一来源是 main.py 的 `--version` 与 CHANGELOG.md。

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = ["dashboard", "data", "output", "input", ".local-artifacts", ".venv"]
addopts = "-q"
markers = [
  "integration: 需要外部网络、浏览器或真实凭据的用例（默认不强制跳过）",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "dashboard",
  "data",
  "output",
  "input",
  ".local-artifacts",
  ".local-reference",
  ".venv",
  "src/dashboard/static",
]

[tool.ruff.lint]
# 只启用能稳定通过的规则集：真实缺陷（未定义名/未使用导入等）。
# 风格类规则（I/UP/B）请先补齐存量再逐步放开。
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E501", # 行宽由 line-length 约束，不在 lint 阶段阻塞
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"] # 测试中保留显式导入便于阅读
"tests/test_auth.py" = ["E402"] # 先注入 sys.path 才能 import src.*

[tool.coverage.run]
source = ["src"]
omit = ["src/dashboard/static/*"]

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
